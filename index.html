<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SiteShot - Simple Website Screenshot Capture</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>SiteShot</h2>
    <p class="description">Enter a website URL to discover and screenshot its pages automatically.</p>
    
    <form id="capture-form">
      <input type="url" id="url-input" placeholder="https://example.com" required>
      <button type="submit" id="submit-btn">Capture Website</button>
    </form>

    <div id="progress-container" class="hidden">
      <div class="progress-bar-bg">
        <div id="progress-bar" style="width: 0%"></div>
      </div>
      <p id="status-text">Starting...</p>
    </div>

    <div id="result-container" class="hidden">
      <p class="success-msg">✓ Screenshots captured successfully!</p>
      <button id="open-btn">Open Screenshots Folder</button>
    </div>

    <div id="error-container" class="hidden">
      <p id="error-text"></p>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>

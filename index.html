<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Website screenshot capture and alt tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <h2>SiteShot</h2>
      <button id="settings-toggle-btn" class="icon-btn" title="API Settings">⚙️</button>
    </div>
    
    <!-- Main View -->
    <div id="main-view">
      <p class="description">Enter a website URL to discover and screenshot its pages automatically.</p>
      
      <form id="capture-form">
        <input type="url" id="url-input" placeholder="https://example.com" required>
        <button type="submit" id="submit-btn">Capture Website</button>
      </form>

      <div id="progress-container" class="hidden">
        <div class="progress-bar-bg">
          <div id="progress-bar" style="width: 0%"></div>
        </div>
        <p id="status-text">Starting...</p>
      </div>

      <div id="result-container" class="hidden">
        <p class="success-msg">✓ Screenshots captured successfully!</p>
        <div class="button-group">
          <button id="open-btn">Open Screenshots Folder</button>
          <button id="open-report-btn">Open Alt Report</button>
        </div>
      </div>

      <div id="error-container" class="hidden">
        <p id="error-text"></p>
      </div>
    </div>

    <!-- Settings View -->
    <div id="settings-view" class="hidden">
      <p class="description">Configure your Google AI Studio API Key. This is saved locally on your computer.</p>
      
      <form id="settings-form">
        <input type="password" id="api-key-input" placeholder="Google AI Studio API Key" required>
        <div class="button-group">
          <button type="submit" id="save-settings-btn">Save Key</button>
          <button type="button" id="back-to-main-btn" class="secondary-btn">Back</button>
        </div>
      </form>
      <div id="settings-status" class="settings-status-msg hidden">Settings saved!</div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
